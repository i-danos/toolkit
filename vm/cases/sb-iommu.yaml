{
 "id": "secure_boot_dataplane_requires_iommu",
 "item": "secure_boot_dataplane_requires_iommu",
 "suite_commit": "auto",
 "description": "Under OVMF Secure Boot on the installed image (KVM -cpu host): without an IOMMU the data plane does not start (vplane-uio prints 'Secure Level / Lockdown enabled and iommu/vfio not available', exit 255, NIC stays enp0s2); with a virtual IOMMU (q35 kernel-irqchip=split, intel-iommu, NIC iommu_platform=on) it is active, the NIC is bound to vfio-pci, named dp0p0s2 and gets a DHCP address; with Secure Boot off it starts on uio_pci_generic. Same disk and NVRAM, three independent copies. A virtual IOMMU, not a physical one.",
 "basis": [
  "design: handoff/tasks/SB-r7.md",
  "observed: docs/DEFECTS.md section 19",
  "release/mk-release.py VERIFICATION_ITEMS secure_boot_dataplane_requires_iommu"
 ],
 "vars": {
  "vm_dir": "/home/aikon/danos/build-iso/danos-sources/toolkit/vm",
  "iso": "/home/aikon/danos/acceptance-p05/iso-r5/i-danos_2608_20261103T0000-amd64.hybrid.iso",
  "out": "/home/aikon/danos/acceptance-p05/secure-boot-iommu",
  "vfv": "/home/aikon/danos/.obs/venv-sb/bin/virt-fw-vars"
 },
 "steps": [
  {
   "name": "run-sb-iommu-fixture",
   "basis": "design: one install under OVMF Secure Boot, then three boots of independent copies of that disk and NVRAM; caps on every wait, trap cleanup; directory emptied first",
   "cmd": "case \"$(basename {{out}})\" in secure-boot-*) ;; *) echo \"BAD_OUT {{out}}\"; exit 2;; esac; rm -rf {{out}}; mkdir -p {{out}}; bash {{vm_dir}}/verify-sb-iommu.sh {{iso}} {{out}} {{vfv}} > {{out}}.fixture.stdout 2>&1; echo \"FIXTURE_RC=$?\"; mv {{out}}.fixture.stdout {{out}}/fixture.stdout; grep -E '^qemu: ' {{out}}/fixture.stdout | head -1; grep -E '^iso_sha256=' {{out}}/results.txt; grep -E '^(stage-install|d[123] (boot|superuser|guest)) rc=' {{out}}/results.txt",
   "timeout": 5400,
   "expect_exit": 0,
   "expect_regex": [
    "^FIXTURE_RC=[0-9]+$",
    "^qemu: -enable-kvm -cpu host ",
    "^iso_sha256=[0-9a-f]{64}$",
    "^stage-install rc=0$",
    "^d1 boot rc=0$",
    "^d1 guest rc=0$",
    "^d2 boot rc=0$",
    "^d2 guest rc=0$",
    "^d3 boot rc=0$",
    "^d3 guest rc=0$"
   ]
  },
  {
   "name": "d1-secure-boot-is-on",
   "basis": "design: docs/DEFECTS.md section 19 and release/mk-release.py secure_boot_dataplane_requires_iommu; asserted on the guest's own serial output",
   "cmd": "sed 's/\\x1b\\[[0-9;?]*[A-Za-z]//g' {{out}}/serial-d1.log | tr -d '\\r' | grep -aE 'Secure boot (en|dis)abled' | head -1 | sed 's/^\\[ *[0-9.]*\\] //'",
   "timeout": 30,
   "expect_exit": 0,
   "expect_regex": [
    "^Secure boot enabled$"
   ]
  },
  {
   "name": "d1-the-machine-has-no-iommu",
   "basis": "design: docs/DEFECTS.md section 19 and release/mk-release.py secure_boot_dataplane_requires_iommu; asserted on the guest's own serial output",
   "cmd": "sed 's/\\x1b\\[[0-9;?]*[A-Za-z]//g' {{out}}/serial-d1.log | tr -d '\\r' | grep -aE '^IOMMUGROUPS=' ",
   "timeout": 30,
   "expect_exit": 0,
   "expect_regex": [
    "^IOMMUGROUPS=0$"
   ]
  },
  {
   "name": "d1-the-dataplane-does-not-start",
   "basis": "design: docs/DEFECTS.md section 19 and release/mk-release.py secure_boot_dataplane_requires_iommu; asserted on the guest's own serial output",
   "cmd": "sed 's/\\x1b\\[[0-9;?]*[A-Za-z]//g' {{out}}/serial-d1.log | tr -d '\\r' | grep -aE '^(failed|active|activating|inactive)$|^NRestarts=' ",
   "timeout": 30,
   "expect_exit": 0,
   "expect_regex": [
    "^failed$",
    "^NRestarts=[1-9][0-9]*$"
   ],
   "expect_not_regex": [
    "^active$"
   ]
  },
  {
   "name": "d1-vplane-uio-refuses-and-says-why",
   "basis": "design: docs/DEFECTS.md section 19 and release/mk-release.py secure_boot_dataplane_requires_iommu; asserted on the guest's own serial output",
   "cmd": "sed 's/\\x1b\\[[0-9;?]*[A-Za-z]//g' {{out}}/serial-d1.log | tr -d '\\r' | grep -aE 'Secure Level' | grep -av 'grep' | grep -a 'vplane-uio' | tail -1",
   "timeout": 30,
   "expect_exit": 0,
   "expect_regex": [
    "^[A-Z][a-z]{2} [0-9]{2} [0-9:]{8} node vplane-uio\\[[0-9]+\\]: Secure Level / Lockdown enabled and iommu/vfio not available$"
   ]
  },
  {
   "name": "d1-the-service-exits-255",
   "basis": "design: docs/DEFECTS.md section 19 and release/mk-release.py secure_boot_dataplane_requires_iommu; asserted on the guest's own serial output",
   "cmd": "sed 's/\\x1b\\[[0-9;?]*[A-Za-z]//g' {{out}}/serial-d1.log | tr -d '\\r' | grep -aE 'Control process exited' | tail -1",
   "timeout": 30,
   "expect_exit": 0,
   "expect_regex": [
    "^[A-Z][a-z]{2} [0-9]{2} [0-9:]{8} node systemd\\[1\\]: vyatta-dataplane.service: Control process exited, code=exited, status=255/EXCEPTION$"
   ]
  },
  {
   "name": "d1-the-nic-stays-enp0s2",
   "basis": "design: docs/DEFECTS.md section 19 and release/mk-release.py secure_boot_dataplane_requires_iommu; asserted on the guest's own serial output",
   "cmd": "sed 's/\\x1b\\[[0-9;?]*[A-Za-z]//g' {{out}}/serial-d1.log | tr -d '\\r' | grep -aE '^enp0s2 |^PCIDRV=|^Device .dp0p0s2. does not exist' ",
   "timeout": 30,
   "expect_exit": 0,
   "expect_regex": [
    "^enp0s2 +DOWN +52:54:00:",
    "^PCIDRV=virtio-pci$",
    "^Device \"dp0p0s2\" does not exist\\.$"
   ],
   "expect_not_regex": [
    "^dp0p0s2 "
   ]
  },
  {
   "name": "d2-secure-boot-is-on",
   "basis": "design: docs/DEFECTS.md section 19 and release/mk-release.py secure_boot_dataplane_requires_iommu; asserted on the guest's own serial output",
   "cmd": "sed 's/\\x1b\\[[0-9;?]*[A-Za-z]//g' {{out}}/serial-d2.log | tr -d '\\r' | grep -aE 'Secure boot (en|dis)abled' | head -1 | sed 's/^\\[ *[0-9.]*\\] //'",
   "timeout": 30,
   "expect_exit": 0,
   "expect_regex": [
    "^Secure boot enabled$"
   ]
  },
  {
   "name": "d2-the-virtual-iommu-is-there",
   "basis": "design: docs/DEFECTS.md section 19 and release/mk-release.py secure_boot_dataplane_requires_iommu; asserted on the guest's own serial output",
   "cmd": "sed 's/\\x1b\\[[0-9;?]*[A-Za-z]//g' {{out}}/serial-d2.log | tr -d '\\r' | grep -aE '^IOMMUGROUPS=' ",
   "timeout": 30,
   "expect_exit": 0,
   "expect_regex": [
    "^IOMMUGROUPS=[1-9][0-9]*$"
   ]
  },
  {
   "name": "d2-the-dataplane-is-active-and-never-restarted",
   "basis": "design: docs/DEFECTS.md section 19 and release/mk-release.py secure_boot_dataplane_requires_iommu; asserted on the guest's own serial output",
   "cmd": "sed 's/\\x1b\\[[0-9;?]*[A-Za-z]//g' {{out}}/serial-d2.log | tr -d '\\r' | grep -aE '^(failed|active|activating|inactive)$|^NRestarts=' ",
   "timeout": 30,
   "expect_exit": 0,
   "expect_regex": [
    "^active$",
    "^NRestarts=0$"
   ],
   "expect_not_regex": [
    "^failed$"
   ]
  },
  {
   "name": "d2-no-refusal-was-printed",
   "basis": "design: docs/DEFECTS.md section 19 and release/mk-release.py secure_boot_dataplane_requires_iommu; asserted on the guest's own serial output",
   "cmd": "n=$(sed 's/\\x1b\\[[0-9;?]*[A-Za-z]//g' {{out}}/serial-d2.log | tr -d '\\r' | grep -a 'vplane-uio' | grep -ac 'Secure Level'); echo REFUSALS=$n",
   "timeout": 30,
   "expect_exit": 0,
   "expect_regex": [
    "^REFUSALS=0$"
   ]
  },
  {
   "name": "d2-the-nic-is-bound-to-vfio-and-named-dp0p0s2",
   "basis": "design: docs/DEFECTS.md section 19 and release/mk-release.py secure_boot_dataplane_requires_iommu; asserted on the guest's own serial output",
   "cmd": "sed 's/\\x1b\\[[0-9;?]*[A-Za-z]//g' {{out}}/serial-d2.log | tr -d '\\r' | grep -aE '^dp0p0s2 |^PCIDRV=' ",
   "timeout": 30,
   "expect_exit": 0,
   "expect_regex": [
    "^dp0p0s2 +(DOWN|UP) +([0-9a-f]{2}:){5}[0-9a-f]{2} ",
    "^PCIDRV=vfio-pci$"
   ],
   "expect_not_regex": [
    "^enp0s2 "
   ]
  },
  {
   "name": "d2-the-port-gets-a-dhcp-address",
   "basis": "design: docs/DEFECTS.md section 19 and release/mk-release.py secure_boot_dataplane_requires_iommu; asserted on the guest's own serial output",
   "cmd": "sed -n '/MARK_d2_ADDR_BEGIN/,/MARK_d2_ADDR_END/p' <(sed 's/\\x1b\\[[0-9;?]*[A-Za-z]//g' {{out}}/serial-d2.log | tr -d '\\r') | grep -aE '^dp0p0s2 '",
   "timeout": 60,
   "expect_exit": 0,
   "expect_regex": [
    "^dp0p0s2 +UP +10\\.0\\.2\\.[0-9]+/24 "
   ]
  },
  {
   "name": "d3-secure-boot-is-off",
   "basis": "design: docs/DEFECTS.md section 19 and release/mk-release.py secure_boot_dataplane_requires_iommu; asserted on the guest's own serial output",
   "cmd": "sed 's/\\x1b\\[[0-9;?]*[A-Za-z]//g' {{out}}/serial-d3.log | tr -d '\\r' | grep -aE 'Secure boot (en|dis)abled' | head -1 | sed 's/^\\[ *[0-9.]*\\] //'",
   "timeout": 30,
   "expect_exit": 0,
   "expect_regex": [
    "^Secure boot disabled$"
   ]
  },
  {
   "name": "d3-the-dataplane-starts-on-uio-pci-generic-without-an-iommu",
   "basis": "design: docs/DEFECTS.md section 19 and release/mk-release.py secure_boot_dataplane_requires_iommu; asserted on the guest's own serial output",
   "cmd": "sed 's/\\x1b\\[[0-9;?]*[A-Za-z]//g' {{out}}/serial-d3.log | tr -d '\\r' | grep -aE '^(failed|active|activating|inactive)$|^NRestarts=|^PCIDRV=|^IOMMUGROUPS=' ",
   "timeout": 30,
   "expect_exit": 0,
   "expect_regex": [
    "^active$",
    "^NRestarts=0$",
    "^PCIDRV=uio_pci_generic$",
    "^IOMMUGROUPS=0$"
   ],
   "expect_not_regex": [
    "^failed$"
   ]
  },
  {
   "name": "d3-the-port-is-dp0p0s2-with-a-dhcp-address",
   "basis": "design: docs/DEFECTS.md section 19 and release/mk-release.py secure_boot_dataplane_requires_iommu; asserted on the guest's own serial output",
   "cmd": "sed -n '/MARK_d3_ADDR_BEGIN/,/MARK_d3_ADDR_END/p' <(sed 's/\\x1b\\[[0-9;?]*[A-Za-z]//g' {{out}}/serial-d3.log | tr -d '\\r') | grep -aE '^dp0p0s2 '",
   "timeout": 60,
   "expect_exit": 0,
   "expect_regex": [
    "^dp0p0s2 +UP +10\\.0\\.2\\.[0-9]+/24 "
   ]
  }
 ]
}
