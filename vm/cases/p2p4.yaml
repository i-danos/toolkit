{
 "id": "p2p4-seam-crash",
 "item": "a02_p2p4_seam_crash_journal",
 "suite_commit": "auto",
 "description": "Runs as root from cloud-init (see execution-context). A02 crash points P2 (record durable, call not sent) and P4 (component replied, record not yet settled) on the real image, with the default-off hooks of configd 2.12.2danos7. The journal fields are common to both seams, so they cannot tell P2 from P4. What does: the seam marker file the hook leaves (call_err not_sent at P2, the component's real reply at P4), and acmd's own files (none touched at P2; all three rewritten and the exact rule present at P4). Everything observable at the seam is copied and configd is killed in a single step, because the pause is bounded at 15 s. After the crash the case checks the fence verdict and that reconcile brings acmd's three files back byte-identical to their baseline. The configd startup-reconcile lines are read from journald; when journald is unusable those two steps are SKIPPED (not passed) and the rest still judged. Remaining limit: nothing here was observed on a real image yet except what the basis of each step says.",
 "vars": {
  "acmd_conf": "/opt/vyatta/etc/acmd.conf",
  "configruleset": "/opt/vyatta/etc/configruleset.txt",
  "policy_file": "/usr/share/dbus-1/vci-local.conf",
  "ref_p2": "/tmp/vc-ref-p2",
  "ref_p4": "/tmp/vc-ref-p4",
  "state_dir": "/etc/danos/test-hooks/state",
  "snap_root": "/tmp",
  "journal": "/var/run/vyatta/configd/commit-state.json",
  "comp": "net.vyatta.vci.acmd.v1"
 },
