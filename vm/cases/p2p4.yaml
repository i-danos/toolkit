{
 "id": "p2p4-seam-crash",
 "item": "a02_p2p4_seam_crash_journal",
 "suite_commit": "auto",
 "description": "A02 crash points P2 (record durable, not sent) and P4 (replied, not settled) on the real image, using the default-off hooks in configd 2.12.2danos6. The journal fields are common to both seams, so they cannot tell P2 from P4; what does is acmd's own state, read from the files its Set() writes (acmd.conf, configruleset.txt, vci-local.conf) and its process state: at P2 none of them has changed and rule N is absent, at P4 all three are newer than a reference time, rule N is present and acmd is not stopped. Nothing is read from journald (it core-dumps under TCG). Why not the FIFO: the hook releases as soon as anything opens the FIFO for reading, so reading it to prove 'configd is parked here' would release the seam before the kill. Remaining limit: P3 (acmd stuck inside Set) and P4 differ only by acmd having finished, which is inferred from the files and process state, not seen directly. Needs a root shell on the guest.",
 "vars": {
  "acmd_conf": "/opt/vyatta/etc/acmd.conf",
  "configruleset": "/opt/vyatta/etc/configruleset.txt",
  "policy_file": "/usr/share/dbus-1/vci-local.conf",
  "ref_p2": "/tmp/vc-ref-p2",
  "ref_p4": "/tmp/vc-ref-p4"
 },
 "basis": [
  "real output: handoff/verify/R3-p2p4-capture-20261026.md; evidence/p2p4-20261026/p2-transcript.txt, p4-transcript.txt (ISO i-danos_2608_20261026T2243, configd 2.12.2danos6)",
  "hook design: assessment-2026-10-18/P2P4-HOOK-DESIGN.md; journal fields: A02-PHASE3-DESIGN.md 6.1, 6.4",
  "acmd-side evidence: config/auth/acmd/vci-component.go:52-73 (order of the file writes in Set), vci-acm-v1.go:60 (rules serialise as \"tagnode\":N)",
  "steps whose basis starts 'design' or 'fixture fix' were never observed: the capture could not reach the reconcile verdicts (session id problem) and the acmd-side file/process evidence was not collected; they may legitimately fail here"
 ],
