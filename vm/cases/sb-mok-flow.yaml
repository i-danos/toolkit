{
 "id": "signed_boot_chain_mok_enrollment_flow",
 "item": "signed_boot_chain_mok_enrollment_flow",
 "suite_commit": "auto",
 "description": "The MOK enrolment flow with a throwaway self-signed certificate (the OBS certificate cannot be queued: the kernel already carries it and db has it): `mokutil --import --ignore-keyring` queues it, MokManager's 'View key 0' (serial, issuer, subject, SHA-1 fingerprint) read from the serial console equals openssl's output for the same file, after the reboot `mokutil --list-enrolled` shows it next to the Debian Secure Boot CA, and the OBS certificate is in the kernel's keys (/proc/keys) and in db, which is why importing it is skipped.",
 "basis": [
  "design: handoff/verify/suite-config.json items.signed_boot_chain_mok_enrollment_flow (4 required cases, SB-r5)",
  "finding: the OBS certificate is in the kernel's .builtin_trusted_keys and must be in db (or MokList) for the chain to boot, so mokutil skips it"
 ],
 "vars": {
  "vm_dir": "/home/aikon/danos/build-iso/danos-sources/toolkit/vm",
  "iso": "/home/aikon/danos/acceptance-p05/topo-test4/i-danos_2608_20261030T0752-amd64.hybrid.iso",
  "out": "/home/aikon/danos/acceptance-p05/secure-boot-mok-flow",
  "vfv": "/home/aikon/danos/.obs/venv-sb/bin/virt-fw-vars"
 },
 "steps": [
  {
   "name": "run-sb-mok-flow-fixture",
   "basis": "design: caps on every wait, trap cleanup; directory emptied first",
   "cmd": "case \"$(basename {{out}})\" in secure-boot-*) ;; *) echo \"BAD_OUT {{out}}\"; exit 2;; esac; rm -rf {{out}}; mkdir -p {{out}}; bash {{vm_dir}}/verify-sb-mok-flow.sh {{iso}} {{out}} {{vfv}} > {{out}}.fixture.stdout 2>&1; echo \"FIXTURE_RC=$?\"; mv {{out}}.fixture.stdout {{out}}/fixture.stdout; grep -E '^qemu:' {{out}}/fixture.stdout | head -1; grep -E '^iso_sha256=' {{out}}/results.txt; grep -E '^stage-(boot|reboot)' {{out}}/results.txt",
   "timeout": 5400,
   "expect_exit": 0,
   "expect_regex": [
    "^FIXTURE_RC=0$",
    "^qemu: -enable-kvm -cpu host ",
    "^iso_sha256=[0-9a-f]{64}$",
    "^stage-boot rc=0$"
   ]
  },
  {
   "name": "mokutil-import-queues-a-throwaway-certificate",
   "basis": "design: mokutil --import --ignore-keyring of a self-signed certificate puts its SHA-1 in mokutil --list-new",
   "cmd": "python3 -I {{vm_dir}}/mok-judge.py {{out}} control queue",
   "timeout": 60,
   "expect_exit": 0,
   "expect_regex": [
    "queued=yes"
   ]
  },
  {
   "name": "mokmanager-shows-the-throwaway-certificates-fingerprint",
   "basis": "design: MokManager View key 0 (read from the serial console) equals openssl for serial, issuer, subject and SHA-1 fingerprint",
   "cmd": "python3 -I {{vm_dir}}/mok-judge.py {{out}} control view",
   "timeout": 60,
   "expect_exit": 0,
   "expect_regex": [
    "serial-matches-openssl=yes"
   ]
  },
  {
   "name": "after-reboot-the-throwaway-certificate-is-enrolled",
   "basis": "design: mokutil --list-enrolled after the reboot has the certificate and the Debian Secure Boot CA",
   "cmd": "python3 -I {{vm_dir}}/mok-judge.py {{out}} control enrolled",
   "timeout": 60,
   "expect_exit": 0,
   "expect_regex": [
    "key-enrolled=yes"
   ]
  },
  {
   "name": "the-obs-certificate-is-already-in-the-kernel-trusted-keyring",
   "basis": "finding: the OBS certificate is in the guest's /proc/keys (matched by subject key identifier) and in mokutil --db (matched by SHA-1); either missing is a FAIL",
   "cmd": "python3 -I {{vm_dir}}/mok-judge.py {{out}} obs obs-trusted",
   "timeout": 60,
   "expect_exit": 0,
   "expect_regex": [
    "in-kernel-keys=yes",
    "in-db=yes"
   ]
  }
 ]
}