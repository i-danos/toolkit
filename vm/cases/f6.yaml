   "basis": "fixture fix, untested on a guest: R3-p2p4-capture-20261026.md found cfgcli kept a dead session id after configd restarted. Cause (reproduced on bash 5.2): the first eval of getSessionEnv in the persistent shell makes VYATTA_CONFIG_SID readonly, so every later session was set up but the shell, and cfgcli, kept the old id. The session is now created inside a subshell and cfgcli is given the id with env. The earlier SID=$(sh -c ...) form left $SID empty ('Must specify session ID') while its step still passed",
