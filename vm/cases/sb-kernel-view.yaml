{
 "id": "signed_boot_chain_kernel_view_and_add_image_check",
 "item": "signed_boot_chain_kernel_view_and_add_image_check",
 "suite_commit": "auto",
 "description": "On a disk the installer wrote under OVMF Secure Boot (KVM -cpu host, guest clock = host clock), the installed system's own view: mokutil --sb-state, the kernel log line 'Secure boot enabled', `add system image` completing with no signature error on the correct chain, and the install-time signing check (the ISO's own check_binary_signatures, unmodified) printing its failure when the image's GRUB is tampered. /sys/kernel/security/lockdown is recorded, not an expectation.",
 "basis": [
  "observed: 2026-10-31 interactive sbkv guest: installed disk boots to login, mokutil/sudo/dmesg need superuser + new login",
  "root cause of the 5h59m sbkv hang: uefi-install.sh leaves the VM running by design; the case had no timeout and no trap (now sb-lib.sh)",
  "design: handoff/verify/suite-config.json items.signed_boot_chain_kernel_view_and_add_image_check (4 required cases, SB-r4)",
  "finding: check_binary_signatures is silent on success and compares certificate subjects only: a flipped bit in the hashed image is NOT noticed by it (shim catches that at boot, see signed_boot_chain_installed_disk); removing the signature is"
 ],
 "vars": {
  "vm_dir": "/home/aikon/danos/build-iso/danos-sources/toolkit/vm",
  "iso": "/home/aikon/danos/acceptance-p05/topo-test4/i-danos_2608_20261030T0752-amd64.hybrid.iso",
  "out": "/home/aikon/danos/acceptance-p05/secure-boot-kernel-view",
  "vfv": "/home/aikon/danos/.obs/venv-sb/bin/virt-fw-vars"
 },
 "steps": [
  {
   "name": "run-sb-kernel-view-fixture",
   "basis": "design: sb-lib.sh caps every boot at 900 s and traps cleanup; the directory is emptied first",
   "cmd": "case \"$(basename {{out}})\" in secure-boot-*) ;; *) echo \"BAD_OUT {{out}}\"; exit 2;; esac; rm -rf {{out}}; mkdir -p {{out}}; bash {{vm_dir}}/verify-sb-kernel-view.sh {{iso}} {{out}} {{vfv}} > {{out}}.fixture.stdout 2>&1; echo \"FIXTURE_RC=$?\"; mv {{out}}.fixture.stdout {{out}}/fixture.stdout; grep -E '^qemu:' {{out}}/fixture.stdout | head -1; grep -E '^iso_sha256=' {{out}}/results.txt; grep -E '^stage-' {{out}}/results.txt; echo \"RESULT_LINES=$(wc -l < {{out}}/results.txt)\"",
   "timeout": 5400,
   "expect_exit": 0,
   "expect_regex": [
    "^FIXTURE_RC=0$",
    "^qemu: -enable-kvm -cpu host ",
    "^iso_sha256=[0-9a-f]{64}$",
    "^stage-install rc=0$",
    "^stage-boot rc=0$",
    "^stage-collect done$",
    "^stage-tamper-check rc=0$"
   ]
  },
  {
   "name": "mokutil-reports-secureboot-enabled",
   "basis": "design: mokutil --sb-state in the installed guest",
   "cmd": "grep -a 'SecureBoot' {{out}}/mokutil.out | tr -d '\\r' | sed 's/^ *//'",
   "timeout": 30,
   "expect_exit": 0,
   "expect_regex": [
    "^SecureBoot enabled$"
   ],
   "expect_not_regex": [
    "disabled"
   ]
  },
  {
   "name": "kernel-logs-secure-boot-enabled",
   "basis": "design: kernel log line from dmesg (the kernel timestamp is dropped: verify-case strips raw kernel console lines from step output)",
   "cmd": "grep -a -i 'secure boot enabled' {{out}}/dmesg.out | tr -d '\\r' | sed 's/^\\[ *[0-9.]*\\] */dmesg: /' | grep -v 'grep' | head -1",
   "timeout": 30,
   "expect_exit": 0,
   "expect_regex": [
    "^dmesg: Secure boot enabled$"
   ]
  },
  {
   "name": "add-system-image-completes-without-a-signature-error",
   "basis": "design: on the correct chain `add system image` downloads, checks MD5, installs and prints Done., with no signature/verification line anywhere in its output",
   "cmd": "echo lockdown: $(tr -d '\\r' < {{out}}/lockdown.out | grep -aE '\\[.*\\]' | head -1); A=$(tr -d '\\r' < {{out}}/addimage.out); printf '%s\\n' \"$A\" | grep -aE '^ISO download succeeded|MD5 checksums.*OK|^Done\\.$'; echo signature-error-lines=$(printf '%s\\n' \"$A\" | grep -aicE 'signature|signing check|verification failed|Warning: secure boot|could not be verified')",
   "timeout": 30,
   "expect_exit": 0,
   "expect_regex": [
    "^ISO download succeeded\\.$",
    "^Done\\.$",
    "^signature-error-lines=0$"
   ],
   "expect_not_regex": [
    "signature-error-lines=[1-9]"
   ]
  },
  {
   "name": "add-system-image-reports-the-signing-failure-when-the-chain-is-tampered",
   "basis": "design: the ISO's real check_binary_signatures is silent on the real chain and prints its failure for a GRUB with the signature removed; a body bit flip is recorded too (it is not detected by this check)",
   "cmd": "T={{out}}/tamper-check; cat $T/results.txt | tr '\\n' ' '; echo; echo positive-output-bytes=$(wc -c < $T/positive.out | tr -d ' '); echo tamper-body-output-bytes=$(wc -c < $T/tamper-body.out | tr -d ' '); tr -d '\\r' < $T/tamper-nosig.out",
   "timeout": 30,
   "expect_exit": 0,
   "expect_regex": [
    "positive rc=0",
    "tamper-nosig rc=1",
    "^positive-output-bytes=1$",
    "^Signing check, failed to get signature for .*/usr/lib/grub/x86_64-efi-signed/grubx64\\.efi\\.signed$"
   ]
  }
 ]
}