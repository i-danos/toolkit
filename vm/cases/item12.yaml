{
 "id": "item12-w2-write-failure",
 "item": "a02_item12_w2_journal_write_failure",
 "suite_commit": "auto",
 "description": "A02 item 12: the end-of-commit (W2) journal write fails and the failure is reported, not silent. The injector swaps the journal for a directory right after the commit's 'persisting' journal write and before the runfile is written, so the W2 write that follows must fail. It is event driven (inotify), does the swap in one renameat2(RENAME_EXCHANGE) and, to take speed out of the race, pins configd and itself to one cpu and runs SCHED_FIFO (the scheduler then guarantees it runs before configd's next instruction). The first version polled the runfile mtime every 0.5 ms and, on KVM, swapped the journal only after W2 had been written: no warning, commit:null. Needs a root shell, python3, inotify and renameat2 on the guest.",
 "basis": [
  "real output: handoff/verify/R3-item12-20261026.md and evidence/item12-20261026/i12-transcript.txt (ISO i-danos_2608_20261026T0452)",
  "warning text: configd session/commitmgr_journal.go:142",
  "injector: handoff/runs/item12-r1 - container test against real configd commits on tmpfs: the old injector produced the warning in 25 of 200 commits, this one in 240 of 240; its behaviour in a KVM guest is not measured yet",
  "journal fields: A02-PHASE3-DESIGN.md 6.1"
 ],
 "steps": [
  {
   "name": "services-active",
   "basis": "observed: handoff/verify/R3-item12-20261026.md, evidence/item12-20261026/i12-transcript.txt",
   "cmd": "for i in $(seq 1 60); do systemctl is-active --quiet configd && systemctl is-active --quiet acmd && break; sleep 5; done; echo \"configd=$(systemctl is-active configd) acmd=$(systemctl is-active acmd)\"",
   "timeout": 330,
   "expect_regex": "^configd=active acmd=active$"
  },
  {
   "name": "execution-context",
   "basis": "measured on the guest: runcmd runs under cloud-init-main.service (cgroup 0::/system.slice/cloud-init-main.service), not cloud-final; asserts root + any cloud-init stage, the context the A/B run used.",
   "cmd": "echo \"uid=$(id -u)\"; cat /proc/$$/cgroup",
   "expect_exit": 0,
   "expect_regex": [
    "^uid=0$",
    "cloud-init[^\\n]*\\.service"
   ]
  },
  {
   "name": "install-injector",
   "basis": "observed: handoff/verify/R3-item12-20261026.md, evidence/item12-20261026/i12-transcript.txt",
   "cmd": "cat > /root/w2watch.py <<'PY'\nimport ctypes,os,select,struct,subprocess,sys,time\nD=os.environ.get('W2_DIR','/var/run/vyatta/configd');J=os.environ.get('W2_JOURNAL',D+'/commit-state.json');B=J+'.bak';N=os.path.basename(J)\nW=os.environ.get('W2_TODO','net.vyatta.vci.acmd.v1').encode()\nL=ctypes.CDLL(None,use_errno=True);I=L.inotify_init1(0)\nif I<0 or L.inotify_add_watch(I,D.encode(),0x80)<0:print('W2WATCH: inotify unavailable');sys.exit(1)\nos.mkdir(B)\ndef swap():\n    a=(-100,J.encode(),-100,B.encode(),2)\n    try:r=L.renameat2(*a)\n    except AttributeError:r=L.syscall(316,*a)\n    if r:os.rmdir(B);os.rename(J,B);os.mkdir(J)\nS={}\ntry:\n    if os.environ.get('W2_PIN')=='0':raise RuntimeError('W2_PIN=0')\n    c=min(os.sched_getaffinity(0))\n    p=int(os.environ.get('W2_PID')or subprocess.run(['systemctl','show','-p','MainPID','--value','configd'],capture_output=True,text=True).stdout)\n    for t in os.listdir('/proc/%d/task'%p):S[int(t)]=os.sched_getaffinity(int(t));os.sched_setaffinity(int(t),{c})\n    os.sched_setaffinity(0,{c});os.sched_setscheduler(0,os.SCHED_FIFO,os.sched_param(50))\n    print('W2WATCH: pinned %d configd threads and this process to cpu %d, SCHED_FIFO'%(len(S),c))\nexcept Exception as e:print('W2WATCH: WARNING not pinned (%r): best effort only'%(e,))\ndef unpin():\n    for t,a in S.items():\n        try:os.sched_setaffinity(t,a)\n        except OSError:pass\nprint('W2WATCH: armed',flush=True)\nend=time.time()+300\nwhile time.time()<end:\n    if not select.select([I],[],[],1)[0]:continue\n    b=os.read(I,65536);o=0\n    while o<len(b):\n        _,_,_,n=struct.unpack_from('iIII',b,o);m=b[o+16:o+16+n].rstrip(b'\\0').decode();o+=16+n\n        if m!=N:continue\n        try:f=os.open(J,os.O_RDONLY);h=os.pread(f,512,0);os.close(f)\n        except OSError:continue\n        if b'\"state\":\"persisting\"' in h and W in h:\n            try:swap();print('W2WATCH: CAUGHT runfile write, journal replaced by dir at %s (swapped at the persisting write)'%time.strftime('%H:%M:%S'),flush=True)\n            except Exception as e:print('W2WATCH: failed to inject: %r'%(e,))\n            unpin();sys.exit(0)\nunpin();print('W2WATCH: no runfile write within deadline')\nPY\npython3 -m py_compile /root/w2watch.py && echo INJECTOR_COMPILES",
   "expect_exit": 0,
   "expect_regex": "^INJECTOR_COMPILES$"
  },
