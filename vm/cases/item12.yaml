  {
   "name": "session-live-after-session-setup",
   "basis": "design (not yet observed): cli-shell-api inSession exits non-zero unless configd reports the session to exist (vyatta-cfg src/cli_shell_api.cpp:250-255). setupSession and discard print nothing, so on their own they prove no session exists. env VYATTA_CONFIG_SID=$SID, not a VAR=x prefix: with VYATTA_CONFIG_SID readonly bash prints 'readonly variable', still runs the command with the OLD value and returns 0 (reproduced on bash 5.2.37, R4-f6-set-rootcause-20261027.md), which passed a session that was never set up. The output must be exactly SID=<number>: no 'readonly', no 'does not exist'",
   "cmd": "echo \"SID=$SID\"; env VYATTA_CONFIG_SID=$SID cli-shell-api inSession",
   "expect_exit": 0,
   "expect_regex": "\\A\\s*SID=[1-9][0-9]*\\s*\\Z",
   "expect_not_regex": [
    "readonly",
    "does not exist",
    "not a valid",
    "Must specify"
   ]
  },
