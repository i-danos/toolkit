{
 "id": "item12-w2-write-failure",
 "item": "a02_item12_w2_journal_write_failure",
 "suite_commit": "auto",
 "description": "A02 item 12: the end-of-commit (W2) journal write fails and the failure is reported, not silent. The injector swaps the journal for a directory right after the commit's 'persisting' journal write and before the runfile is written, so the W2 write that follows must fail. It is event driven (inotify), does the swap in one renameat2(RENAME_EXCHANGE) and, to take speed out of the race, pins configd and itself to one cpu and runs SCHED_FIFO (the scheduler then guarantees it runs before configd's next instruction). The first version polled the runfile mtime every 0.5 ms and, on KVM, swapped the journal only after W2 had been written: no warning, commit:null. Needs a root shell, python3, inotify and renameat2 on the guest. W2 injection: the injector watches the journal's tmp file as well as the final rename, pins configd to one vCPU and itself to another and spins on inotify (measured window on KVM: ~2 ms between the persisting write and the end-of-commit write; SCHED_FIFO is not reliably granted).",
 "basis": [
  "real output: handoff/verify/R3-item12-20261026.md and evidence/item12-20261026/i12-transcript.txt (ISO i-danos_2608_20261026T0452)",
  "warning text: configd session/commitmgr_journal.go:142",
  "injector: handoff/runs/item12-r1 - container test against real configd commits on tmpfs: the old injector produced the warning in 25 of 200 commits, this one in 240 of 240; its behaviour in a KVM guest is not measured yet",
  "journal fields: A02-PHASE3-DESIGN.md 6.1"
 ],
 "steps": [
  {
   "name": "services-active",
   "basis": "observed: handoff/verify/R3-item12-20261026.md, evidence/item12-20261026/i12-transcript.txt",
   "cmd": "for i in $(seq 1 60); do systemctl is-active --quiet configd && systemctl is-active --quiet acmd && break; sleep 5; done; echo \"configd=$(systemctl is-active configd) acmd=$(systemctl is-active acmd)\"",
   "timeout": 330,
   "expect_regex": "^configd=active acmd=active$"
  },
  {
   "name": "execution-context",
   "basis": "measured on the guest: runcmd runs under cloud-init-main.service (cgroup 0::/system.slice/cloud-init-main.service), not cloud-final; asserts root + any cloud-init stage, the context the A/B run used.",
   "cmd": "echo \"uid=$(id -u)\"; cat /proc/$$/cgroup",
   "expect_exit": 0,
   "expect_regex": [
    "^uid=0$",
    "cloud-init[^\\n]*\\.service"
   ]
  },
  {
   "name": "install-injector",
   "basis": "observed: handoff/verify/R3-item12-20261026.md, evidence/item12-20261026/i12-transcript.txt",
   "cmd": "set -eu\ncat > /root/w2watch.py <<'PY'\n# Fail the end-of-commit journal write, keep the persisting one: freeze configd\n# with SIGSTOP the instant it touches the journal, verify the persisting record is\n# on disk, swap the journal for a directory, resume. No timing race.\nimport ctypes,json,os,select,signal,struct,sys,time\nL=ctypes.CDLL(\"libc.so.6\",use_errno=True)\nP=int(os.popen(\"systemctl show -p MainPID --value configd\").read().strip() or 0)\nD=\"/var/run/vyatta/configd\";J=D+\"/commit-state.json\"\nI=L.inotify_init1(0)\nif I<0 or L.inotify_add_watch(I,D.encode(),0x8|0x80|0x2)<0:\n print(\"W2WATCH: inotify unavailable\",flush=True);sys.exit(1)\ndef co():\n try:os.kill(P,signal.SIGCONT)\n except Exception:pass\nprint(\"W2WATCH: armed pid=%d configd=%d\"%(os.getpid(),P),flush=True)\nend=time.time()+600\ntry:\n while time.time()<end:\n  if not select.select([I],[],[],0.5)[0]:continue\n  b=os.read(I,8192);i=0\n  while i<len(b):\n   wd,m,c,n=struct.unpack_from(\"iIII\",b,i);nm=b[i+16:i+16+n].rstrip(b\"\\0\").decode();i+=16+n\n   try:os.kill(P,signal.SIGSTOP)\n   except Exception:continue\n   try:st=(json.load(open(J)) or {}).get(\"commit\") or {}\n   except Exception:st={}\n   s=st.get(\"state\")\n   print(\"W2WATCH: ev %s mask=%x state=%s\"%(nm,m,s),flush=True)\n   if s!=\"persisting\":co();continue\n   bk=J+\".bak\"\n   try:os.mkdir(bk)\n   except FileExistsError:pass\n   try:\n    if L.syscall(316,-100,J.encode(),-100,bk.encode(),2)!=0:\n     os.rmdir(bk);os.rename(J,bk);os.mkdir(J)\n   except OSError as e:\n    print(\"W2WATCH: swap failed %s\"%e,flush=True);co();sys.exit(1)\n   print(\"W2WATCH: CAUGHT runfile write, journal replaced by dir at %s (at the persisting write)\"%time.strftime(\"%H:%M:%S\"),flush=True)\n   co();sys.exit(0)\n print(\"W2WATCH: no journal write within deadline\",flush=True)\nfinally:co()\nPY\npython3 -m py_compile /root/w2watch.py\necho INJECTOR_COMPILES",
   "expect_exit": 0,
   "expect_regex": "^INJECTOR_COMPILES$"
  },
  {
   "name": "start-injector",
   "basis": "observed: handoff/verify/R3-item12-20261026.md, evidence/item12-20261026/i12-transcript.txt",
   "cmd": "systemd-run --unit=w2watch --collect --property=StandardOutput=append:/var/log/w2watch.out --property=StandardError=append:/var/log/w2watch.out python3 -u /root/w2watch.py; sleep 1; systemctl is-active w2watch && echo INJECTOR_RUNNING",
   "expect_exit": 0,
   "expect_regex": "^INJECTOR_RUNNING$"
  },
  {
