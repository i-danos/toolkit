{
 "id": "f6-diagnose",
 "item": "fixture_diagnose",
 "suite_commit": "auto",
 "description": "Why was set refused on the first real runs while show worked. The text 'Configuration path: [] is not valid' is just how an access-denied error with no path is formatted (R4-r3). Whether the ACM denies root differs by execution context (R4-r6: allowed from cloud-init, refused from the serial console in an earlier run, mechanism unexplained). acm-files records the ACM data. The probes run the SAME cfgcli -print set the failing step ran under one varied condition each; each one should pass or fail alike; a difference between them is the finding. Needs a root shell; changes nothing (cfgcli -print only prints).",
 "basis": [
  "handoff/verify/r4-r1c-hermes/f6-real.junit.xml: session-setup and discard passed, `vcli -s $SID -c show` worked, the four set steps failed",
  "vyatta-cfg/scripts/vcli runs `bash -c` after setup_env; vyatta-cfg/functions/script-wrapper: set -> cmd_helper -> `cfgcli -print`; configd/cmd/cfgcli/main.go dials configd with $VYATTA_CONFIG_SID",
  "configd/server/conn.go:168 treats uid 0 as superuser, so root being refused is the thing to explain"
 ],
 "steps": [
  {
   "name": "acm-files",
   "basis": "design: configd loads the authdb from configruleset.txt at start and again on every change to it; with the file missing or unreadable it starts with an empty, disabled authdb (config/auth/auth.go:201-208,306-310,571-596), which allows everything. The image ships no such file",
   "cmd": "ls -l --time-style=full-iso /opt/vyatta/etc/configruleset.txt /opt/vyatta/etc/acmd.conf; head -c 300 /opt/vyatta/etc/configruleset.txt",
   "expect_exit": 0,
   "expect_regex": "configruleset\\.txt"
  },
  {
   "name": "identity-is-root",
   "basis": "fixture: a probe; the first real run (handoff/verify/r4-r1c-hermes/f6-real.junit.xml) failed set with 'Configuration path: [] is not valid / authorization failed'",
   "cmd": "id; grep -E '^(Uid|Gid|Groups):' /proc/$$/status",
   "expect_exit": 0,
   "expect_regex": "^uid=0\\(root\\) gid=0\\(root\\)"
  },
  {
   "name": "environment-of-the-console-shell",
   "basis": "fixture: a probe; the first real run (handoff/verify/r4-r1c-hermes/f6-real.junit.xml) failed set with 'Configuration path: [] is not valid / authorization failed'",
   "cmd": "env | grep -E '^(HOME|LOGNAME|SHELL|TERM|USER|PATH|VYATTA[A-Z_]*)=' | sort",
   "expect_exit": 0,
   "expect_regex": "^HOME="
  },
  {
   "name": "controlling-terminal",
   "basis": "fixture: a probe; the first real run (handoff/verify/r4-r1c-hermes/f6-real.junit.xml) failed set with 'Configuration path: [] is not valid / authorization failed'; tty prints /dev/ttyS0 on the serial login and 'not a tty' under cloud-init (no controlling terminal). Both are legitimate, anything else (a pty, an error) is not; the value is anchored on the TTY= line, not matched anywhere in the output",
   "cmd": "TTY=$(tty 2>&1); echo \"TTY=$TTY\"",
   "expect_exit": 0,
   "expect_regex": "^TTY=(/dev/ttyS0|not a tty)$"
  },
  {
   "name": "shell-process-row",
   "basis": "fixture: a probe; the first real run (handoff/verify/r4-r1c-hermes/f6-real.junit.xml) failed set with 'Configuration path: [] is not valid / authorization failed'; proves ps reports THIS shell with its pid, ppid and tty columns (the awk keeps only the row whose pid is $$)",
   "cmd": "ps -o pid=,ppid=,tty= -p $$ | awk -v p=$$ '$1==p {print \"PS_PID_MATCH=1 PPID=\" $2 \" TTY=\" $3}'",
   "expect_exit": 0,
   "expect_regex": "^PS_PID_MATCH=1 PPID=[0-9]+ TTY=\\S+$"
  },
  {
   "name": "services-active",
   "basis": "fixture: a probe; the first real run (handoff/verify/r4-r1c-hermes/f6-real.junit.xml) failed set with 'Configuration path: [] is not valid / authorization failed'",
   "cmd": "for i in $(seq 1 60); do systemctl is-active --quiet configd && systemctl is-active --quiet acmd && break; sleep 5; done; echo \"configd=$(systemctl is-active configd) acmd=$(systemctl is-active acmd)\"",
   "timeout": 330,
   "expect_regex": "^configd=active acmd=active$"
  },
  {
   "name": "session-setup",
   "basis": "fixture: a probe; the first real run (handoff/verify/r4-r1c-hermes/f6-real.junit.xml) failed set with 'Configuration path: [] is not valid / authorization failed'",
   "cmd": "SID=$$; ( eval \"$(cli-shell-api getSessionEnv $SID)\"; cli-shell-api setupSession )",
   "expect_exit": 0
  },
  {
   "name": "session-live-after-session-setup",
   "basis": "design (not yet observed): cli-shell-api inSession exits non-zero unless configd reports the session to exist (vyatta-cfg src/cli_shell_api.cpp:250-255). setupSession and discard print nothing, so on their own they prove no session exists. env VYATTA_CONFIG_SID=$SID, not a VAR=x prefix: with VYATTA_CONFIG_SID readonly bash prints 'readonly variable', still runs the command with the OLD value and returns 0 (reproduced on bash 5.2.37, R4-f6-set-rootcause-20261027.md), which passed a session that was never set up. The output must be exactly SID=<number>: no 'readonly', no 'does not exist'",
   "cmd": "echo \"SID=$SID\"; env VYATTA_CONFIG_SID=$SID cli-shell-api inSession",
   "expect_exit": 0,
   "expect_regex": "\\A\\s*SID=[1-9][0-9]*\\s*\\Z",
   "expect_not_regex": [
    "readonly",
    "does not exist",
    "not a valid",
    "Must specify"
   ]
  },
  {
   "name": "probe-as-the-failing-step-ran-it",
   "basis": "fixture: a probe; the first real run (handoff/verify/r4-r1c-hermes/f6-real.junit.xml) failed set with 'Configuration path: [] is not valid / authorization failed'",
   "cmd": "vcli -s $SID -c \"cfgcli -print set system acm ruleset rule 1 path /system/login\"",
   "expect_exit": 0,
   "expect_not_regex": [
    "authorization failed",
    "is not valid",
    "Set failed"
   ]
  },
  {
   "name": "probe-clean-environment",
   "basis": "fixture: a probe; the first real run (handoff/verify/r4-r1c-hermes/f6-real.junit.xml) failed set with 'Configuration path: [] is not valid / authorization failed'; differs from the failing step only in the environment variables",
   "cmd": "env -i HOME=/root PATH=/usr/sbin:/usr/bin:/sbin:/bin vcli -s $SID -c \"cfgcli -print set system acm ruleset rule 1 path /system/login\"",
   "expect_exit": 0,
   "expect_not_regex": [
    "authorization failed",
    "is not valid",
    "Set failed"
   ]
  },
  {
   "name": "probe-without-a-controlling-terminal",
   "basis": "fixture: a probe; the first real run (handoff/verify/r4-r1c-hermes/f6-real.junit.xml) failed set with 'Configuration path: [] is not valid / authorization failed'; differs only in having no controlling terminal (cloud-init, where R3's f6 worked, has none)",
   "cmd": "setsid -w vcli -s $SID -c \"cfgcli -print set system acm ruleset rule 1 path /system/login\" < /dev/null",
   "expect_exit": 0,
   "expect_not_regex": [
    "authorization failed",
    "is not valid",
    "Set failed"
   ]
  },
  {
   "name": "probe-with-a-fresh-session-id",
   "basis": "fixture: a probe; the first real run (handoff/verify/r4-r1c-hermes/f6-real.junit.xml) failed set with 'Configuration path: [] is not valid / authorization failed'; differs only in the session id. The first version evaluated getSessionEnv in the persistent shell, where VYATTA_CONFIG_SID is already readonly, so SID2 was never set up and the step reported 'session 225411 does not exist': an invalid probe. It now creates the session in a subshell, requires inSession to confirm it, and only then runs set",
   "cmd": "SID2=$((200000 + RANDOM)); ( eval \"$(cli-shell-api getSessionEnv $SID2)\"; cli-shell-api setupSession ) && env VYATTA_CONFIG_SID=$SID2 cli-shell-api inSession && echo \"SID2=$SID2\" && vcli -s $SID2 -c \"cfgcli -print set system acm ruleset rule 1 path /system/login\"",
   "expect_exit": 0,
   "expect_regex": "^SID2=[1-9][0-9]*$",
   "expect_not_regex": [
    "authorization failed",
    "is not valid",
    "Set failed",
    "does not exist",
    "readonly"
   ]
  },
  {
   "name": "session-live-after-probe-with-a-fresh-session-id",
   "basis": "design (not yet observed): cli-shell-api inSession exits non-zero unless configd reports the session to exist (vyatta-cfg src/cli_shell_api.cpp:250-255). setupSession and discard print nothing, so on their own they prove no session exists. env VYATTA_CONFIG_SID=$SID, not a VAR=x prefix: with VYATTA_CONFIG_SID readonly bash prints 'readonly variable', still runs the command with the OLD value and returns 0 (reproduced on bash 5.2.37, R4-f6-set-rootcause-20261027.md), which passed a session that was never set up. The output must be exactly SID=<number>: no 'readonly', no 'does not exist'",
   "cmd": "echo \"SID=$SID\"; env VYATTA_CONFIG_SID=$SID cli-shell-api inSession",
   "expect_exit": 0,
   "expect_regex": "\\A\\s*SID=[1-9][0-9]*\\s*\\Z",
   "expect_not_regex": [
    "readonly",
    "does not exist",
    "not a valid",
    "Must specify"
   ]
  },
  {
   "name": "probe-the-read-path-for-contrast",
   "basis": "fixture: a probe; the first real run (handoff/verify/r4-r1c-hermes/f6-real.junit.xml) failed set with 'Configuration path: [] is not valid / authorization failed'; cli-shell-api showConfig worked in the real run",
   "cmd": "vcli -s $SID -c \"show system acm\" | head -3",
   "expect_exit": 0,
   "expect_regex": "acm"
  }
 ]
}
